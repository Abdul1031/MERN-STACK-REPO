# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ART2

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install server dependencies
        working-directory: ./server
        run: npm install --omit=dev

      - name: Install client dependencies
        working-directory: ./client
        run: npm install

      - name: Build client
        working-directory: ./client
        run: npm run build

      - name: Create deployment package
        run: |
          mkdir -p deploy/client/dist

          # Copy server files
          cp server/package.json deploy/
          cp server/package-lock.json deploy/
          cp server/index.js deploy/
          cp server/app.js deploy/
          cp -r server/config deploy/
          cp -r server/controllers deploy/
          cp -r server/middlewares deploy/
          cp -r server/models deploy/
          cp -r server/routes deploy/
          cp -r server/node_modules deploy/

          # Copy built React client
          cp -r client/dist/* deploy/client/dist/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8311688E097C447F9AD7AECC3A5C9B21 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9B85E56C306940D289BD427D8448500C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DC6C669351404760B027F7066D324166 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ART2'
          slot-name: 'Production'
          package: .